<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Logger configuration - Deye</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18332e;background:#f0f4f0;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:100%;max-width:480px}.brand{font-size:13px;letter-spacing:.12em;color:#526b60;margin:0 0 20px}
    section{background:#fff;border:1px solid #dbe4dc;border-radius:20px;padding:32px;box-shadow:0 12px 48px #18332e08}
    h1{font-size:28px;letter-spacing:-.03em;margin:0 0 12px}p{color:#5c7068;line-height:1.6;margin:0 0 24px}
    label{display:block;font-size:14px;font-weight:600;margin:22px 0 8px}input{width:100%;border:1px solid #b9c9c0;border-radius:10px;padding:13px;font:inherit;color:inherit;background:#fff}
    input:focus{outline:3px solid #a4c8b6;outline-offset:2px;border-color:#1c664c}.hint{display:block;font-size:12px;color:#65786e;margin-top:8px}
    button{width:100%;margin-top:28px;border:0;border-radius:10px;padding:14px;background:#205c43;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#174a35}
    .notice{border-left:3px solid #45836a;background:#f1f7f3;padding:12px 14px;font-size:14px;margin:24px 0 0}.error{border-color:#b65740;background:#fff4ef;color:#823e2d}
    footer{font-size:12px;color:#65786e;line-height:1.6;margin-top:20px;padding:0 4px}@media(max-width:400px){section{padding:24px}body{padding:16px}}
  </style>
</head>
<body>
<main>
  <div class="brand">DEYE INVERTER</div>
  <section aria-labelledby="title">
    <h1 id="title">Logger configuration</h1>
    <p>Set the connection address used to read inverter data over Modbus TCP.</p>
    <form method="post" action="/logger">
      <input type="hidden" name="token" value="{{TOKEN}}">
      <label for="host">Logger host</label>
      <input id="host" name="host" value="{{HOST}}" required maxlength="63" pattern="[A-Za-z0-9](?:[A-Za-z0-9.\-]{0,61}[A-Za-z0-9])?" placeholder="IP address or hostname" autocapitalize="none" spellcheck="false" autocomplete="off" aria-describedby="host-hint">
      <span class="hint" id="host-hint">Enter only the address, without http:// or a port.</span>
      <label for="port">Port</label>
      <input id="port" name="port" type="number" value="{{PORT}}" required min="1" max="65535" step="1" inputmode="numeric">
      <button type="submit">Save configuration</button>
    </form>
    {{NOTICE}}
  </section>
  <footer>Changes take effect on the next polling cycle.<br>No restart required.</footer>
</main>
</body>
</html>
